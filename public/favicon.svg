<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="darkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A5B"/>
      <stop offset="100%" stop-color="#071936"/>
    </linearGradient>
    <linearGradient id="icePeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  
  <!-- Outer shield / faceted stone base -->
  <polygon points="32,4 58,18 52,50 32,60 12,50 6,18" fill="url(#darkFacet)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Back mountain ridge in sky blue -->
  <polygon points="32,12 48,36 16,36" fill="url(#skyGrad)"/>
  
  <!-- Left faceted mountain peak -->
  <polygon points="22,20 34,44 10,44" fill="#0EA5E9"/>
  <polygon points="22,20 26,29 22,27 18,29" fill="url(#icePeak)"/>

  <!-- Right dominant mountain peak with geological stone strata -->
  <polygon points="38,15 54,48 26,48" fill="url(#skyGrad)"/>
  <polygon points="38,15 44,26 38,23 32,26" fill="url(#icePeak)"/>
  
  <!-- Precision faceted cuts at base -->
  <polygon points="32,40 48,54 32,58 16,54" fill="#0369A1" opacity="0.9"/>
  <line x1="32" y1="40" x2="32" y2="58" stroke="#38BDF8" stroke-width="2"/>
  <line x1="16" y1="54" x2="48" y2="54" stroke="#7DD3FC" stroke-width="1"/>
</svg>